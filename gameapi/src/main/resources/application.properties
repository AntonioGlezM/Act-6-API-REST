# =============================================
# Configuración de la aplicación GameAPI
# =============================================

spring.application.name=gameapi

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:gamedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola H2 habilitada para la defensa ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- JWT ---
jwt.secret=GameApiSecretKeyParaFirmarTokensJWT2024MuySegura123456
jwt.expiration=3600000
