# =============================================
# Configuración de la aplicación GameAPI
# =============================================

spring.application.name=gameapi

# --- Base de datos MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/gamedb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- JWT ---
jwt.secret=GameApiSecretKeyParaFirmarTokensJWT2024MuySegura123456
jwt.expiration=3600000

# --- Swagger UI / OpenAPI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Ordena los endpoints por método HTTP (DELETE, GET, POST, PUT) dentro de cada grupo
springdoc.swagger-ui.operationsSorter=method
# Ordena los grupos (tags) alfabéticamente
springdoc.swagger-ui.tagsSorter=alpha